name: style

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # commit-message checking needs the history the PR added
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync

      - name: writing style in docs
        run: uv run python scripts/check_style.py

      - name: commit message style
        if: github.event_name == 'pull_request'
        run: |
          uv run python scripts/check_style.py \
            --git-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
