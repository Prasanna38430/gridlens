# Local stack. Every service sits behind a profile, because this box has 8 GB
# and the week 3 and 4 services cannot all run at once.
#
#     docker compose --profile airflow up -d
#
# Logs go to a named volume rather than a bind mount. The repository lives
# inside OneDrive, and pointing a process that writes log files every few
# seconds at a syncing folder is how you get file locks and sync storms. Dags
# are bind mounted read only, because they are small and rarely written.

x-airflow-common: &airflow-common
  # stock airflow plus great expectations and the project's runtime deps.
  # see docker/airflow.Dockerfile for why gridlens itself is not installed.
  image: gridlens-airflow:3.3.1
  build:
    context: ./docker
    dockerfile: airflow.Dockerfile
    # dbt's pins live with the dbt project. The image reads them from there
    # rather than keeping a second copy that could drift from the host's.
    additional_contexts:
      transform: ./transform
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?run make env first}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?run make env first}
    # Airflow 3 task processes reach the database through the task execution
    # api rather than connecting to it. The default points at localhost, which
    # inside the scheduler container is nothing, so every task dies on connect.
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:8080
    # The scheduler parses nothing in airflow 3. A dag that imports a module it
    # cannot find fails in the dag processor, so its logs are the ones to read.
    PYTHONPATH: /opt/airflow/project/src
    AWS_PROFILE: gridlens
    AWS_DEFAULT_REGION: eu-west-3
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/project/src:ro
    # read write, unlike src, since dbt writes into its project by default. The
    # audit points target/ and logs/ at /tmp instead: sharing target/ with dbt
    # on the windows host crashed the first run, because the parse cache keys
    # files by path and windows writes them with backslashes.
    - ./transform:/opt/airflow/project/transform
    - ./scripts:/opt/airflow/project/scripts:ro
    - ${HOME}/.aws:/home/airflow/.aws:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    profiles: ["airflow"]
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate
    restart: "no"
    mem_limit: 640m

  airflow-apiserver:
    <<: *airflow-common
    profiles: ["airflow"]
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 640m

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["airflow"]
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    # local executor forks task processes in here, and the quality task imports
    # pandas and great expectations. 640m was enough for the smoke dag and is
    # not enough for this one.
    #
    # Measured on 2026-10-01: about 580 MiB idle, 800 running the quality
    # suite, 891 running dbt for the restatement audit. The two are scheduled
    # apart, but unpausing after a gap queues both at once. On 2026-10-05 they
    # overlapped for about half a minute and peaked at 926, under 100 short of
    # the old 1024m, with only part of each run in the overlap.
    mem_limit: 1536m

  airflow-dag-processor:
    <<: *airflow-common
    profiles: ["airflow"]
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 512m

  # The stream profile, one profile at a time with airflow. Measured on
  # 2026-10-05: redpanda 236 MiB and the producer 52 MiB after the first polls.
  # But redpanda is allowed to grow to the 512M it is given, and with airflow
  # at its own measured peak of 1,348 MiB that is within a few dozen MB of the
  # 2 GB WSL cap. Too close to run both.
  #
  #     make stream-up
  #
  # dev-container mode is redpanda's own setting for exactly this, one node on a
  # laptop: no fsync per write and no core pinning. Losing the last second of
  # writes in a crash is acceptable here, because every message can be fetched
  # again from entso-e.
  redpanda:
    image: redpandadata/redpanda:v25.2.9
    profiles: ["stream"]
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
    ports:
      - "19092:19092"
      - "18081:18081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    restart: unless-stopped

  producer:
    image: gridlens-stream:0.1.0
    build:
      context: ./docker
      dockerfile: stream.Dockerfile
    profiles: ["stream"]
    environment:
      GRIDLENS_KAFKA_BOOTSTRAP: redpanda:9092
      GRIDLENS_SCHEMA_REGISTRY: http://redpanda:8081
      AWS_PROFILE: gridlens
      AWS_DEFAULT_REGION: eu-west-3
    volumes:
      - ./src:/opt/gridlens/src:ro
      - ${HOME}/.aws:/home/producer/.aws:ro
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

volumes:
  airflow-db:
  airflow-logs:
  redpanda-data:
