[project]
name = "gridlens"
version = "0.0.0"
description = "Bitemporal lakehouse over European electricity market data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "tzdata>=2026.3",
]

[dependency-groups]
# boto3 is here rather than in dependencies on purpose. the lambda runtime
# ships it, so bundling it would add tens of megabytes to every deploy for a
# copy that never gets used. the cost is that we run against whatever version
# aws provides, which is a real risk and the reason nothing types against it.
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "boto3>=1.43.72",
    "great-expectations>=1.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridlens"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]

# boto3 ships no type information and we deliberately do not pull in the stubs,
# see the note on the dev group above. everything we call through it is behind
# a narrow protocol except the handler, which is the one place it is untyped.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true

# great_expectations re-exports its expectation classes without an __all__, so
# strict mode calls every one of them an implicit reexport
[[tool.mypy.overrides]]
module = ["great_expectations.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
